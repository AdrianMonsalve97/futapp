services:
  - type: web
    name: futapp
    runtime: node
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Bogota
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN
        value: '1'
      - key: ADMIN_EMAIL
        value: admin@futapp.local
      - key: ADMIN_NAME
        value: Administrador de migración
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: futapp-media
